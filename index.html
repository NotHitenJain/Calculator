<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>best calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="calc">
        <input id = "display" type= "text" readonly placeholder="0">
            <button id ="btnac" class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            <br>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <br>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <br>
            <button id = "btn0">0</button>
            <button>.</button>
            <button id="btne" class="equalbtn">=</button>
    </section>
    <script src="main.js"></script>
</body>
</html>
